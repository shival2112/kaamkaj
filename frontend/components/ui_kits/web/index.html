<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kaamkaj — Find Your Dream Job in India</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="StatsBar.jsx"></script>
  <script type="text/babel" src="CategoryGrid.jsx"></script>
  <script type="text/babel" src="JobCard.jsx"></script>
  <script type="text/babel" src="JobList.jsx"></script>
  <script type="text/babel" src="CompanyStrip.jsx"></script>
  <script type="text/babel" src="CtaBanner.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="JobDetail.jsx"></script>

  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState({ name: 'home' });

      // Restore last view across reloads (helpful while iterating).
      React.useEffect(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('kaamkaj.view') || 'null');
          if (saved) setView(saved);
        } catch {}
      }, []);
      React.useEffect(() => {
        localStorage.setItem('kaamkaj.view', JSON.stringify(view));
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [view]);

      const goHome   = () => setView({ name: 'home' });
      const openJob  = (job) => setView({ name: 'detail', jobId: job.id });
      const searchJobs = ({ q, city }) => setView({ name: 'search', q, city });

      const currentJob = view.name === 'detail' ? kData.jobs.find(j => j.id === view.jobId) : null;

      return (
        <div data-screen-label={view.name === 'home' ? 'Home' : view.name === 'detail' ? `Job · ${currentJob?.title}` : 'Search'}>
          <Navbar active={view.name === 'home' ? 'jobs' : 'jobs'} onNav={goHome} onPostJob={()=>{}}/>
          {view.name === 'home' && (
            <main>
              <Hero onSearch={searchJobs}/>
              <StatsBar/>
              <CategoryGrid onPick={()=>setView({ name: 'search', q: '' })}/>
              <JobList jobs={kData.jobs} onJob={openJob} title="Recommended for you" subtitle="Based on your location and recent activity." alt/>
              <CompanyStrip/>
              <CtaBanner onCta={()=>{}}/>
            </main>
          )}
          {view.name === 'search' && (
            <main>
              <section style={{background:'var(--primary)', padding:'24px 0'}}>
                <div className="k-container k-hero-search" style={{boxShadow:'none', maxWidth:880}}>
                  <div className="field">
                    <Icon.Search size={20} stroke={1.7} style={{color:'#9CA3AF'}}/>
                    <input defaultValue={view.q} placeholder="Job title, skills, company"/>
                  </div>
                  <div className="divider"/>
                  <div className="field city">
                    <Icon.MapPin size={20} stroke={1.7} style={{color:'#9CA3AF'}}/>
                    <input defaultValue={view.city} placeholder="City"/>
                  </div>
                  <button className="k-btn k-btn-primary">Search</button>
                </div>
              </section>
              <JobList jobs={kData.jobs}
                       title={`${kData.jobs.length} jobs matching "${view.q || 'all jobs'}"`}
                       subtitle={view.city ? `in ${view.city} and nearby` : 'across India'}
                       onJob={openJob}
                       showFilters/>
            </main>
          )}
          {view.name === 'detail' && currentJob && (
            <main>
              <JobDetail job={currentJob} onBack={goHome} onApply={()=>{}}/>
            </main>
          )}
          <Footer/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
